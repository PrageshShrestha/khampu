<!DOCTYPE html>
<html>
<head>
<title>Ganesh Animation</title>
<style>
  #ganesh-container {
    width: 100px;
    height: 100px;
    position: relative;
    overflow: hidden;
  }

  #ganesh-svg {
    width: 90px;
    height: 90px;
    position: absolute;
    top: 5px;
    left: 5px;
    animation: rotateGanesh 5s linear infinite, colorChange 10s linear infinite alternate;
    transform-origin: center;
  }

  @keyframes rotateGanesh {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes colorChange {
      0% { fill: gold; }
      50% { fill: #ffd700; }
      100% { fill: #b8860b; }
  }
</style>
</head>
<body>

<div id="ganesh-container">
  <svg id="ganesh-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 15 C 70 15, 85 40, 85 60 C 85 80, 70 95, 50 95 C 30 95, 15 80, 15 60 C 15 40, 30 15, 50 15 Z" fill="gold" />
    <path d="M50 10 C 60 10, 70 20, 70 30 C 70 40, 60 50, 50 50 C 40 50, 30 40, 30 30 C 30 20, 40 10, 50 10 Z" fill="gold" />
    <path d="M50 50 L55 60 L50 70 L45 60 Z" fill="gold" />
    <path d="M75 25 a 10 10 0 0 1 10 10" fill="gold" />
    <path d="M25 25 a 10 10 0 0 0 -10 10" fill="gold" />
  </svg>
</div>

</body>
</html>
